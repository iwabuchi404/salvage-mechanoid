<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engine Test</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #111;
      }

      #game-canvas {
        display: block;
        margin: 20px auto;
        width: 800px;
        height: 600px;
        border: 1px solid #333;
      }
    </style>
  </head>

  <body>
    <canvas id="game-canvas"></canvas>
    <script type="module">
      // テスト用のエントリポイント
      import { TestScene } from './dist/test/TestScene.js';

      window.onload = async () => {
        const canvas = document.getElementById('game-canvas');
        const testScene = new TestScene();
        await testScene.initialize(canvas);
        console.log('Test scene initialized');
      };
    </script>
  </body>
</html>
